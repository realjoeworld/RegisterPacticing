services:

  postgres:
    image: postgres:17
    container_name: register_practicing_db

    restart: unless-stopped

    environment:
      POSTGRES_DB: register_practicing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: